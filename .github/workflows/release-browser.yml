name: Release local browser

on:
  push:
    tags: ["v0.5.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - name: Bound memory use on standard runners
        shell: bash
        run: |
          cat >> .bazelrc.user <<'EOF'
          startup --batch
          startup --host_jvm_args=-Xmx1536m
          common --lockfile_mode=error
          common --jobs=1
          common --local_test_jobs=1
          build -c opt
          EOF
      - name: Install Linux system fonts
        if: runner.os == 'Linux'
        run: |
          getconf GNU_LIBC_VERSION
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fontconfig fonts-dejavu-core fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
      - name: Build and archive the native executable
        shell: bash
        run: |
          args=(--out "$RUNNER_TEMP/browser-package" --archive "$PWD/dist")
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          bazel run -c opt //packages/local-browser:package -- "${args[@]}"
      - name: Test the archived executable
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -- dist/kitesurf-*-"$PLATFORM".tar.gz
          test "$#" -eq 1
          test -f "$1"
          (cd dist && shasum -a 256 -c "${1##*/}.sha256")
          python3 - "$1" <<'PY'
          from pathlib import PurePosixPath
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "r:gz") as archive:
              for member in archive:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or not (member.isfile() or member.isdir()):
                      raise SystemExit(f"Non-portable archive entry: {member.name}")
          PY
          unpacked="$RUNNER_TEMP/browser-unpacked"
          mkdir -p "$unpacked"
          tar -xzf "$1" -C "$unpacked"
          test -x "$unpacked/kitesurf"
          (cd "$unpacked" && shasum -a 256 -c SHA256SUMS)
          bazel test -c opt //packages/local-browser:binary_test \
            --test_env=KITESURF_TEST_BINARY="$unpacked/kitesurf" --test_output=errors
      - name: Verify system font and author font rendering
        env:
          KITESURF_REQUIRE_CJK: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: |
          bazel test -c opt --test_env=KITESURF_REQUIRE_CJK --test_output=errors \
            //packages/local-browser/font-host:unit_test \
            //packages/local-browser:native_system_fonts_test
      - name: Check the source and browser compatibility tests
        if: matrix.platform == 'linux-x64'
        run: |
          pnpm run check
          bazel test //packages/local-browser:browser_test //packages/local-browser:engine_loss_test --test_output=errors
      - uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
