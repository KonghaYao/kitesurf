[package]
name = "kitesurf-local-host"
version = "0.5.4"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "2"

[lib]
name = "kitesurf_local_host"
path = "src/lib.rs"

[[test]]
name = "broker_test"
path = "src/lib.rs"
required-features = ["test-faults"]

[features]
embedded-runtime = []
# 仅 test-faults 变体启用；发行二进制不编译该路径。
test-faults = []

[[bin]]
name = "kitesurf-native"
path = "src/main.rs"

[dependencies]
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
getrandom = "0.2.17"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
kitesurf-font-host = { path = "../font-host" }
libc = "0.2.189"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
ryu-js = "=1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-tungstenite = { version = "0.27.0", default-features = false, features = ["handshake"] }
url = "2.5.8"

[patch.crates-io]
tungstenite = { path = "target/vendor-patched/tungstenite-0.27.0" }
tokio-tungstenite = { path = "target/vendor-patched/tokio-tungstenite-0.27.0" }
