[package]
name = "kitesurf-local-host"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "2"

[lib]
name = "kitesurf_local_host"
path = "src/lib.rs"

[[bin]]
name = "kitesurf-native"
path = "src/main.rs"

[dependencies]
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
getrandom = "0.2.17"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-tungstenite = { version = "0.27.0", default-features = false, features = ["handshake"] }
